methodology_body = """
Dieser Bericht basiert auf kontinuierlichen Netzwerkmessungen aus dem lokalen Netzwerk des Kunden: ICMP-Echo (Ping) alle {icmp_interval} s im Wechsel über {icmp_target_count} bekannte Anycast-Hosts, zusätzlich TCP/443-Verbindungsversuche alle {tcp_interval} s sowie ``mtr``-Routenverfolgungen alle {mtr_interval_min} Minuten. Die Messdaten werden ausschließlich lokal erfasst und gespeichert.
"""

summary_heading = "Zusammenfassung"
