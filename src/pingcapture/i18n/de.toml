summary_probe_success = "Erfolgsrate der Messsonden"
summary_uptime_footnote = "Verfügbarkeit ist der Anteil der Ein-Minuten-Fenster, in denen ein Videoanruf möglich gewesen wäre: kein überlappender Verbindungsausfall, TCP-Paketverlust ≤ 1 %, p95-Hin-und-Rückzeit ≤ 300 ms und Jitter (IQR der Hin-und-Rückzeit) ≤ 75 ms (gemäß ITU/Cisco-Empfehlungen für interaktive Videoanrufe). Die Erfolgsrate der Messsonden ist der reine Anteil zurückgekehrter ICMP/TCP-Sonden, einschließlich einzelner Aussetzer, die kein Anwender bemerken würde."
