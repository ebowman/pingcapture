[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pingcapture"
version = "0.1.0"
description = "Personal DSL reliability monitor: ping/TCP/mtr capture, web console, bilingual reports"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Eric Bowman", email = "ebowman@boboco.ie" }]
license = { text = "MIT" }
dependencies = [
    "icmplib>=3.0.4",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "click>=8.1.7",
    "tomli>=2.0.1; python_version<'3.11'",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-bdd>=7.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "freezegun>=1.5.0",
    "httpx>=0.27.0",
]

[project.scripts]
pingcapture = "pingcapture.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pingcapture"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle, pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "N",            # pep8-naming
    "SIM",          # simplify
    "RET",          # return
]
ignore = ["E501"]  # line-length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
bdd_features_base_dir = "tests/features"
addopts = "-v --strict-markers"
markers = [
    "slow: tests that take several seconds",
    "integration: tests requiring real network or external commands",
]
